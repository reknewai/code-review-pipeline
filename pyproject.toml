[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-pipeline"
version = "0.1.0"
description = "AI-driven review -> fix -> verify pipeline for any git repository"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "jsonschema>=4.20",
]

[project.scripts]
review-pipeline = "review_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_pipeline = ["schemas/findings.schema.json"]

[dependency-groups]
dev = ["pytest>=8", "pre-commit>=3.6", "pyyaml>=6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
